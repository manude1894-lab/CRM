server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers (review 22-11-2026). Repeated in /assets/ below: a location that sets its own add_header drops
  # these. The CSP allows what the CRM loads: its own files, Google Fonts, the API over https (its address comes
  # from config.js at start-up), and blob: for document previews (PDF frame, images) and downloads.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https: http://localhost:8000; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long cache for built assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  # config.js is written at start-up (the API address): never cached, so a changed address applies at once.
  location = /config.js {
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript;
}
