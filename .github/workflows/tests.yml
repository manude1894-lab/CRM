# Runs the backend lint and tests, the frontend tests and build, and the browser tests per role on every push and
# pull request, so a change that breaks something is caught before it is deployed. Coverage must stay above a
# floor (review 22-11-2026, package 6).
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check
      - name: Tests with coverage (at least 88%)
        run: python -m pytest --cov=app --cov-report=term-missing:skip-covered --cov-report=html --cov-fail-under=88
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/htmlcov

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tests with coverage (logic modules at least 80%)
        run: npm run coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage

  # Each desk signs in to a fresh CRM (demo users, empty database) and opens every page it has.
  browser:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/crm
      CORS_ALLOW_ALL: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            e2e/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          pip install -r backend/requirements.txt -r e2e/requirements.txt
          python -m playwright install --with-deps chromium
          npm ci --prefix frontend
      - name: Database and demo users
        working-directory: backend
        run: |
          alembic upgrade head
          python -m app.seed
      - name: Start the CRM
        run: |
          (cd backend && nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > ../backend.log 2>&1 &)
          npm run build --prefix frontend
          (cd frontend && nohup npx vite preview --host 127.0.0.1 --port 5173 --strictPort > ../frontend.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health && curl -sf http://127.0.0.1:5173 > /dev/null && break; sleep 1; done
      - name: Browser tests per role
        working-directory: e2e
        env:
          E2E_APP_URL: http://127.0.0.1:5173
        run: python -m pytest
      - name: Server logs
        if: failure()
        run: tail -n 200 backend.log frontend.log
